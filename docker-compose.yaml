services:
  redis-primary:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6381:6379"
    volumes:
      - redis-primary-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  redis-replica:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6382:6379"
    volumes:
      - redis-replica-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  redis-sentinel-1:
    image: redis:7.4.11-alpine3.21
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    ports:
      - "26379:26379"
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  redis-sentinel-2:
    image: redis:7.4.11-alpine3.21
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    ports:
      - "26380:26379"
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  redis-sentinel-3:
    image: redis:7.4.11-alpine3.21
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"]
    ports:
      - "26381:26379"
    volumes:
      - ./deploy/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  api-1:
    build: .
    cpus: 4.0
    environment:
      PORT: 8080
      ENV: test
      REDIS_MASTER_NAME: rate-limiter-primary
      REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  api-2:
    build: .
    cpus: 4.0
    environment:
      PORT: 8080
      ENV: test
      REDIS_MASTER_NAME: rate-limiter-primary
      REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  single-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8083:8080"
    volumes:
      - ./deploy/nginx/single.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy

  distributed-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8084:8080"
    volumes:
      - ./deploy/nginx/distributed.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
    environment:
      REDIS_HOSTS: primary:redis-primary:6379,replica:redis-replica:6379
    ports:
      - "8082:8081"
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

volumes:
  redis-primary-data:
  redis-replica-data:
