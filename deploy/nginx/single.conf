events {}

http {
    access_log off;

    upstream rate_limiter {
        server api-1:8080;
        keepalive 128;
    }

    server {
        listen 8080;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://rate_limiter;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
