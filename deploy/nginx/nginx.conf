# V7 experiment front door.
#
# Two routes share one Nginx process so the single-instance and distributed
# comparisons share an identical proxy, identical worker count and identical
# connection handling. The only difference between them is the upstream set.
#
#   listen 8083  ->  api-1 only
#   listen 8084  ->  api-1 and api-2, round robin
#
# Nginx performs no rate limiting of its own. The in-memory token bucket inside
# each API process is the only limiter under test.

user  nginx;
worker_processes  auto;
# WSL2 caps the Docker daemon's file-descriptor limit low, so the ceiling is
# raised explicitly; without it every worker is limited to 1024 connections.
worker_rlimit_nofile  65535;
error_log  /dev/stderr  warn;
pid  /tmp/nginx.pid;

events {
    worker_connections  16384;
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  upstream  '$time_iso8601|$status|$upstream_addr|$upstream_status|$request_time|$request_method|$uri';

    # Off for measured capacity trials so the proxy is not writing a log line per
    # request. deploy/nginx/nginx.observability.conf turns it on for the
    # distribution check and the availability run.
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;

    # Shared proxy behaviour, inherited by both routes so the two measurements
    # cannot differ in anything except the number of upstream API processes.
    proxy_http_version  1.1;
    proxy_set_header    Connection        "";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_connect_timeout  1s;
    proxy_send_timeout     10s;
    proxy_read_timeout     10s;

    # Retry the next peer when a peer is unreachable, which is what lets the
    # distributed route survive one instance stopping.
    proxy_next_upstream  error timeout;

    # max_fails/fail_timeout are nginx defaults, stated explicitly because the
    # availability experiment depends on how quickly a failed peer is ejected.
    upstream api_single {
        server api-1:8080 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }

    upstream api_distributed {
        server api-1:8080 max_fails=1 fail_timeout=10s;
        server api-2:8080 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8083;
        server_name _;

        location / {
            proxy_pass http://api_single;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }

    server {
        listen 8084;
        server_name _;

        location / {
            proxy_pass http://api_distributed;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
