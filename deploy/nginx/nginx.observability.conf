# V7 experiment front door, observability variant.
#
# Identical to deploy/nginx/nginx.conf in every directive except access_log,
# which is buffered and enabled so the distribution check and the availability
# run can attribute each request to a specific upstream address. Keep the two
# files line-for-line aligned outside the access_log directive; any other
# difference would invalidate the comparison between the 8083 and 8084 routes.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
error_log  /dev/stderr  warn;
pid  /tmp/nginx.pid;

events {
    worker_connections  16384;
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  upstream  '$time_iso8601|$status|$upstream_addr|$upstream_status|$request_time|$request_method|$uri';

    # Buffering keeps one syscall per 64 KiB instead of one per request. Only
    # used for short low-rate runs, never for a measured capacity trial.
    access_log  /var/log/nginx/access.log  upstream  buffer=64k  flush=1s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;

    proxy_http_version  1.1;
    proxy_set_header    Connection        "";
    proxy_set_header    Host              $host;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_connect_timeout  1s;
    proxy_send_timeout     10s;
    proxy_read_timeout     10s;

    proxy_next_upstream  error timeout;

    upstream api_single {
        server api-1:8080 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }

    upstream api_distributed {
        server api-1:8080 max_fails=1 fail_timeout=10s;
        server api-2:8080 max_fails=1 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8083;
        server_name _;

        location / {
            proxy_pass http://api_single;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }

    server {
        listen 8084;
        server_name _;

        location / {
            proxy_pass http://api_distributed;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
